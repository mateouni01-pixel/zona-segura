<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#456078"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="42" font-family="Arial" font-size="26" font-weight="bold">04 Secuencia de voto comunitario</text><text x="35" y="69" font-family="Arial" font-size="16" fill="#456078">Zona Segura · versión 2.2 · 20 de noviembre de 2026</text><polyline points="180.0,211.0 351.5,211.0 351.5,211.0 523.0,211.0" fill="none" stroke="#456078" stroke-width="1.7" marker-end="url(#arrow)"/><text x="207.5" y="193.0" font-family="Arial" font-size="14" fill="#263f54" stroke="white" stroke-width="4" paint-order="stroke">1 Seleccionar confirmar o desmentir</text><polyline points="525.0,281.0 696.5,281.0 696.5,281.0 868.0,281.0" fill="none" stroke="#456078" stroke-width="1.7" marker-end="url(#arrow)"/><text x="552.5" y="263.0" font-family="Arial" font-size="14" fill="#263f54" stroke="white" stroke-width="4" paint-order="stroke">2 POST votos: confirma y coordenadas +</text><text x="552.5" y="281.0" font-family="Arial" font-size="14" fill="#263f54" stroke="white" stroke-width="4" paint-order="stroke">Bearer</text><polyline points="870.0,351.0 1041.5,351.0 1041.5,351.0 1213.0,351.0" fill="none" stroke="#456078" stroke-width="1.7" marker-end="url(#arrow)"/><text x="897.5" y="333.0" font-family="Arial" font-size="14" fill="#263f54" stroke="white" stroke-width="4" paint-order="stroke">3 Comprobar cuenta y bloquear reporte</text><polyline points="870.0,421.0 1041.5,421.0 1041.5,421.0 1213.0,421.0" fill="none" stroke="#456078" stroke-width="1.7" marker-end="url(#arrow)"/><text x="897.5" y="403.0" font-family="Arial" font-size="14" fill="#263f54" stroke="white" stroke-width="4" paint-order="stroke">4 Validar autor radio estado y voto</text><text x="897.5" y="421.0" font-family="Arial" font-size="1